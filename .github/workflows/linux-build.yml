name: CI Linux

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.name }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    env:
      CTEST_OUTPUT_ON_FAILURE: ON
      CTEST_PARALLEL_LEVEL: 1
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
      VERBOSE: 1  # to show all cmake scripts debug info

    strategy:
      fail-fast: false
      matrix:
        # Github Actions requires a single row to be added to the build matrix.
        # See https://help.github.com/en/articles/workflow-syntax-for-github-actions.
        name: [
          ubuntu-22.04-gcc-ppa-mrpt,
          ubuntu-22.04-clang-ppa-mrpt,
          ubuntu-22.04-gcc-default-mrpt,
          ubuntu-22.04-gcc-tbb-gtsam,
        ]

        build_type: [ Release ]
        include:
          - name: ubuntu-22.04-gcc-ppa-mrpt
            os: ubuntu-22.04
            compiler: gcc
            install_mrpt_ppa: ON
            gtsam_tbb: OFF

          - name: ubuntu-22.04-clang-ppa-mrpt
            os: ubuntu-22.04
            compiler: clang
            install_mrpt_ppa: ON
            gtsam_tbb: OFF

          - name: ubuntu-22.04-gcc-default-mrpt
            os: ubuntu-22.04
            compiler: gcc
            install_mrpt_ppa: OFF
            gtsam_tbb: OFF

          # Exercises factors under a TBB-enabled GTSAM (parallel factor
          # evaluation/linearization), since each factor owns a private
          # clone of its AssembledRigidModel/solver specifically to make
          # that safe. See AssembledRigidModel::clone().
          - name: ubuntu-22.04-gcc-tbb-gtsam
            os: ubuntu-22.04
            compiler: gcc
            install_mrpt_ppa: ON
            gtsam_tbb: ON

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Git submodule
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          # See bug/issue: https://github.com/orgs/community/discussions/47863
          sudo apt-mark hold grub-efi-amd64-signed

          sudo apt-get -y update
          sudo apt-get -y upgrade

          if [ "${{ matrix.install_mrpt_ppa }}" = "ON" ]; then
            sudo apt install software-properties-common -yq
            sudo add-apt-repository ppa:joseluisblancoc/mrpt -y
          fi

          sudo add-apt-repository ppa:borglab/gtsam-develop -y

          if [ "${{ matrix.gtsam_tbb }}" = "ON" ]; then
            GTSAM_PKGS="libgtsam-dev libgtsam-unstable-dev libtbb-dev"
          else
            GTSAM_PKGS="libgtsam-no-tbb-dev libgtsam-no-tbb-unstable-dev"
          fi

          sudo apt install -yq \
            cmake build-essential \
            libmrpt-dev \
            $GTSAM_PKGS \
            libboost-timer-dev

          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++ g++
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          else
            sudo apt-get install -y clang g++-multilib
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: CMake configure
        run: |
          cmake -DCMAKE_VERBOSE_MAKEFILE=ON \
                -H. -Bbuild

      - name: Build
        run: |
          make -C build
          
      - name: Run tests
        run: |
          ctest --verbose --test-dir build
